name: FundFlow Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Repeatable Quality Gate & Offline Verification
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static syntax and bytecode compilation check
        run: |
          python -m compileall src app tests -q

      - name: Contract and schema validation
        run: |
          python -m pytest -q tests/test_contracts.py

      - name: Offline snapshot integrity verification
        run: |
          python -m fundflow.cli -v snapshot --verify

      - name: Deterministic test suite execution (offline)
        run: |
          python -m pytest -q

      - name: Offline application smoke tests
        run: |
          python -m pytest -q tests/test_ui_pages.py tests/test_snapshots.py
